aid: story-health
name: Story Health
description: >-
  Story Health was a virtual specialty care company founded in 2020 by Tom Stanis
  (a Google Verily co-founder), Nikhil Roy, and cardiologist Dr. Ashul Govil. Its
  platform went beyond video visits to give specialty clinicians digital tools for
  continuous, protocol-driven care at scale, focusing initially on cardiology with
  care-plan optimization, therapy titration, and evidence-based adjustments between
  visits. The company raised roughly $27M (a $4M seed in 2020 and a $22.6M Series A
  in 2022) from investors including General Catalyst and Define Ventures, and was
  acquired by Innovaccer in September 2025. It operates a marketing web presence but
  publishes no public developer, API, or documentation surface.
